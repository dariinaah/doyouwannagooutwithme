<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <title>Do you wanna go out with me?</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <link rel="stylesheet" href="./style.css">
    <style>
      .date-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 15px;
      }
      .date-input {
        padding: 12px 16px;
        font-size: 16px;
        border: 2px solid #ff6b81;
        border-radius: 12px;
        width: 260px;
        outline: none;
        text-align: center;
      }
      .send-btn {
        background-color: #ff6b81;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: bold;
      }
      .send-btn:hover {
        background-color: #ff4757;
      }
    </style>
  </head>
  <body>
        <div id="ask" class="container">
            <div>
                <h1 class="header_text">Do you wanna go out with me?</h1>
            </div>
            <div class="gif_container">
                <img src="image/ask.gif" alt="Cute animated illustration">
            </div>
            <div class="buttons">
                <button class="btn" id="yesButton" onclick="nextPage()">Yes</button>
                <button class="btn" id="noButton" onmouseover="moveButton()" onclick="moveButton()">No</button>
            </div>
            <video id="novideo" width="0" height="0" controls>
                <source src="image/SadMoment.mp4" type="video/mp4">
            </video>
        </div>

        <div id="ans" class="container">
            <div>
                <h1 class="header_text">Yeeeyyyy!! Where and when should we go? ❤️</h1>
            </div>
            <div class="gif_container">
                <img src="image/ans.gif" alt="Cute animated illustration">
            </div>
            
            <div class="date-form">
                <input type="text" id="placeInput" class="date-input" placeholder="Where? (e.g., coffee shop, park)">
                <input type="text" id="timeInput" class="date-input" placeholder="When? (e.g., Sunday at 6 PM)">
                <button class="send-btn" onclick="sendReply()">Send reply 💌</button>
            </div>

            <video id="ansvideo" width="0" height="0" controls>
                <source src="image/KidsCheering.mp4" type="video/mp4">
            </video>
        </div>
    </body> 
    <script>
        function playAudio() {
            document.getElementById('novideo').play();
        }

        function nextPage() {
            document.getElementById('ans').style.display = 'block';
            document.getElementById('ask').style.display = 'none';
            document.getElementById('novideo').pause();
            document.getElementById('ansvideo').play();
        }

        function moveButton() {
            var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth);
            var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight);
            document.getElementById('noButton').style.left = `${x}px`;
            document.getElementById('noButton').style.top = `${y}px`;
            playAudio();
        }

        function sendReply() {
            const place = document.getElementById('placeInput').value.trim();
            const time = document.getElementById('timeInput').value.trim();

            if (!place || !time) {
                alert("Please fill in both the place and time 😊");
                return;
            }

            // PUT YOUR TELEGRAM USERNAME HERE (without @)
            const telegramUsername = "dariinaah"; 
            const message = `I'm in! Let's go to: ${place}, time: ${time}`;
            const url = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
            
            window.open(url, '_blank');
        }
    </script> 
</html>
